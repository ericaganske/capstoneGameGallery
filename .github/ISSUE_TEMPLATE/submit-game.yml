name: "Submit a game"
description: "Submit a finished sustainability game for the gallery. It goes live after an admin adds the \"approved\" label."
title: "Game: "
labels: ["game submission"]
body:
  - type: markdown
    attributes:
      value: |
        One submission per game. Test the game link in a private browser window first.
        Everything you enter here is public on GitHub. Nothing appears on the gallery until an admin approves it.

  - type: input
    id: title
    attributes:
      label: "Game title"
      description: "The official name you want shown in the gallery."
      placeholder: "Recycle Rush"
    validations:
      required: true

  - type: dropdown
    id: grouping
    attributes:
      label: "Category"
      options:
        - "Clean Energy & Climate"
        - "Nature & Biodiversity"
        - "Water & Natural Resources"
        - "Waste & Circular Economy"
        - "Sustainable Cities & Communities"
        - "Food & Agriculture"
        - "People & Social Sustainability"
        - "Sustainable Business & Innovation"
    validations:
      required: true

  - type: dropdown
    id: season
    attributes:
      label: "Semester"
      description: "The semester you completed the game."
      options:
        - "Spring"
        - "Summer"
        - "Fall"
        - "Winter"
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: "Year"
      placeholder: "2026"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "1-3 sentences on the game's purpose and what players can expect (40-400 characters)."
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: "Team members"
      description: "First and last names, separated by commas."
      placeholder: "Jane Doe, John Smith"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "1-8 keywords separated by commas. No quotation marks."
      placeholder: "recycling, campus, puzzle"
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: "Cover picture"
      description: "Optional. Drag a picture into this box, or paste a direct link to one. Without a picture, the category's stock picture is shown."
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: "Game link"
      description: "Full https link where anyone can play the game, with no login."
      placeholder: "https://..."
    validations:
      required: true

  - type: checkboxes
    id: permission
    attributes:
      label: "Permission"
      options:
        - label: "My team and I give permission to display this game, its description and picture in the public Sustainability Games Gallery."
          required: true
