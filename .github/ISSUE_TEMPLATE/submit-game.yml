name: "Submit a game"
description: "Submit a finished game or interactive project for the CISC game gallery."
title: "Game submission: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: "One submission per game. Test both links in a private browser window first. Everything you enter here is public on GitHub."
  - type: input
    id: title
    attributes:
      label: "Game title"
      description: "The official name you want shown in the gallery."
      placeholder: "Recycle Rush"
    validations:
      required: true
  - type: dropdown
    id: grouping
    attributes:
      label: "Category"
      options:
        - "Clean Energy & Climate"
        - "Nature & Biodiversity"
        - "Water & Natural Resources"
        - "Waste & Circular Economy"
        - "Sustainable Cities & Communities"
        - "Food & Agriculture"
        - "People & Social Sustainability"
        - "Sustainable Business & Innovation"
    validations:
      required: true
  - type: dropdown
    id: semester
    attributes:
      label: "Semester"
      description: "The semester you completed the project. The year is added automatically."
      options:
        - "Spring"
        - "Summer"
        - "Fall"
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: "Description"
      description: "1-3 sentences on the game's purpose and what players can expect. One line, 40-400 characters."
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: "Team members"
      description: "First and last names, separated by commas."
      placeholder: "Jane Doe, John Smith"
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "1-8 keywords separated by commas. Do not add quotation marks."
      placeholder: "recycling, sustainability, education, puzzle"
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: "Image link"
      description: "Direct https link ending in .png, .jpg, .jpeg, .gif, .webp or .svg."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: "Game link"
      description: "https link where anyone can play the game, with no login."
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: "Permission"
      options:
        - label: "My team and I give permission to display this project, its description and image in the public CISC game gallery."
          required: true
