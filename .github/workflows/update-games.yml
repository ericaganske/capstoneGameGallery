name: Update games.csv

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest CSV
        env:
          CSV_URL: ${{ secrets.GAMES_CSV_URL }}
        run: |
          curl -sSL -o new.csv -w "HTTP %{http_code}, %{size_download} bytes\n" "$CSV_URL"
          echo "First line of download:"
          head -1 new.csv | cat -A | cut -c1-200
          head -1 new.csv | sed 's/^\xEF\xBB\xBF//' | tr -d '\r"' | grep -qi '^title,grouping,team,semester,tags,description,image,url$'
          mv new.csv games.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.csv
          git diff --cached --quiet || (git commit -m "Update games.csv" && git push)
