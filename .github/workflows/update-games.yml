name: Update games.csv

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest CSV
        run: |
          curl -fsSL "${{ secrets.GAMES_CSV_URL }}" -o new.csv
          head -1 new.csv | tr -d '\r"\357\273\277' | grep -qi '^title,grouping,team,semester,tags,description,image,url$'
          mv new.csv games.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.csv
          git diff --cached --quiet || (git commit -m "Update games.csv" && git push)
