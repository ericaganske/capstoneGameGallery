name: Update games.csv

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest CSV
        env:
          CSV_URL: ${{ secrets.GAMES_CSV_URL }}
        run: |
          curl -sSL -c jar.txt -b jar.txt \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" \
            -o new.csv -w "HTTP %{http_code}, %{size_download} bytes\n" "$CSV_URL"
          echo "First non-blank line:"
          grep -v '^[[:space:]]*$' new.csv | head -1 | cut -c1-150
          grep -v '^[[:space:]]*$' new.csv | head -1 | sed 's/^\xEF\xBB\xBF//' | tr -d '\r"' | grep -qi '^title,grouping,team,semester,tags,description,image,url$'
          mv new.csv games.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.csv
          git diff --cached --quiet || (git commit -m "Update games.csv" && git push)
