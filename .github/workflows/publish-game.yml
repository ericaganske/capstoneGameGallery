name: Publish approved game

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: games-csv
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and add row
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const GROUPINGS = [
              "Clean Energy & Climate","Nature & Biodiversity","Water & Natural Resources",
              "Waste & Circular Economy","Sustainable Cities & Communities","Food & Agriculture",
              "People & Social Sustainability","Sustainable Business & Innovation"
            ];

            // Read each "### Label" section of the issue body.
            const f = {};
            (issue.body || '').split(/^### /m).slice(1).forEach(block => {
              const [label, ...rest] = block.split(/\r?\n/);
              const v = rest.join(' ').replace(/\s+/g, ' ').trim();
              f[label.trim()] = v === '_No response_' ? '' : v;
            });

            const clean = s => (s || '').replace(/"/g, "'").trim();
            const title = clean(f['Game title']);
            const grouping = f['Category'] || '';
            const semester = f['Semester'] || '';
            const description = clean(f['Description']);
            const team = clean(f['Team members']);
            const image = (f['Image link'] || '').trim();
            const url = (f['Game link'] || '').trim();
            const tagList = (f['Tags'] || '').split(',')
              .map(t => t.trim().toLowerCase().replace(/"/g, '')).filter(Boolean);

            const problems = [];
            if (!/^[^=+@-].{1,99}$/.test(title)) problems.push('Title must be 2-100 characters and not start with = + - or @.');
            if (!GROUPINGS.includes(grouping)) problems.push('Category is not one of the official categories.');
            if (!/^(Spring|Summer|Fall|Winter) \d{4}$/.test(semester)) problems.push('Semester must look like "Fall 2026".');
            if (description.length < 40 || description.length > 400) problems.push('Description must be 40-400 characters.');
            if (!/^[^0-9=+@]{2,300}$/.test(team)) problems.push('Team must be names separated by commas, with no numbers.');
            if (tagList.length < 1 || tagList.length > 8 || !tagList.every(t => /^[a-z0-9&' -]+$/.test(t))) problems.push('Tags must be 1-8 comma-separated words (letters, numbers, spaces, hyphens, apostrophes).');
            if (!/^https:\/\/[^\s"]+\.(png|jpe?g|gif|webp|svg)(\?[^\s"]*)?$/i.test(image)) problems.push('Image link must be an https link ending in .png, .jpg, .jpeg, .gif, .webp or .svg.');
            if (!/^https:\/\/[^\s"]+\.[^\s"]+$/.test(url)) problems.push('Game link must be a full https link.');

            let csv = fs.readFileSync('games.csv', 'utf8');
            if (url && csv.includes(url)) problems.push('A game with this link is already in the gallery.');

            if (problems.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: 'This submission cannot be published yet:\n\n' + problems.map(p => '- ' + p).join('\n') +
                      '\n\nPlease edit the issue to fix these, then ask a maintainer to add the `approved` label again.'
              });
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, name: 'approved'
              });
              core.setFailed('Validation failed');
              return;
            }

            const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
            const tags = tagList.map(t => '"' + t + '"').join(',');
            const row = [title, grouping, team, semester, tags, description, image, url].map(esc).join(',');
            if (!csv.endsWith('\n')) csv += '\n';
            fs.writeFileSync('games.csv', csv + row + '\n');

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.csv
          git commit -m "Add game from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: 'Published! It may take a few minutes to appear in the gallery.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'
            });
